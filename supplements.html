  <main>
    <section class="products">
      <h2>Supplements</h2>
      <div class="grid">
        <div class="product-card">
          <img src="vitamin.jpg" alt="">
          <h3>Vitamin C (500mg)</h3>
          <div class="price">Rs 250</div>
          <button class="add-to-cart" data-name="Vitamin C (500mg)" data-price="250" data-img="">Add to Cart</button>
        </div>

        <div class="product-card">
          <img src="omega.jpg" alt="">
          <h3>Omega-3 Capsules</h3>
          <div class="price">Rs 800</div>
          <button class="add-to-cart" data-name="Omega-3 Capsules" data-price="800" data-img="">Add to Cart</button>
        </div>

        <div class="product-card">
          <img src="multi.jpg" alt="">
          <h3>Multivitamin</h3>
          <div class="price">Rs 600</div>
          <button class="add-to-cart" data-name="Multivitamin" data-price="600" data-img="">Add to Cart</button>
        </div>
      </div>
    </section>
